[project]
name = "hello-langgraph"
version = "0.1.0"
description = "A minimal LangGraph hello world example."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
hello-langgraph = "hello_langgraph.hello_world:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
